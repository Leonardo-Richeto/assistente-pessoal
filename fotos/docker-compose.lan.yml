# Porta do Immich na rede de casa (Ficha 17, regra 2). Só no IP do i7 na rede local: não responde pela interface
# do Tailscale nem pela internet. O preparar.sh só junta este arquivo depois que o administrador existe.
services:
  immich-server:
    ports:
      - "${ENDERECO_LAN:?defina ENDERECO_LAN no .env}:${PORTA_LAN:-2283}:2283"
