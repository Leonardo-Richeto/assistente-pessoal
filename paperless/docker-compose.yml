# Paperless-ngx único da casa (Ficha 6 de docs/regras-de-negocio.md, D21 do vault).
# Projeto Docker Compose próprio, fora do compose do assistente: cada instância do assistente (a do
# Leonardo e a da esposa) entra numa rede só dela e enxerga só o webserver, pelo nome "paperless".
# O banco e o broker ficam na rede interna, que nenhum assistente vê.
#
# Estado em ${PAPERLESS_HOME} (fora do git):
#   ${PAPERLESS_HOME}/.env              senhas e configuração
#   ${PAPERLESS_HOME}/data/postgres     dados internos do Postgres (nunca copiar crus entre máquinas)
#   ${PAPERLESS_HOME}/data/redis        fila do broker
#   ${PAPERLESS_HOME}/data/paperless    índice de busca e classificador
#   ${PAPERLESS_HOME}/data/media        os documentos (originais e arquivados)
#   ${PAPERLESS_HOME}/consumir/<pessoa> pasta de consumo de cada um (workflow põe o dono)
#   ${PAPERLESS_HOME}/export            área de trabalho do document_exporter (o backup apaga no fim)
#
# Rode sempre pelos scripts de paperless/scripts/ (eles passam o .env de fora).
# Imagens com versão e digest fixos (amd64 e arm64). Para atualizar: leia os avisos de segurança
# novos (github.com/paperless-ngx/paperless-ngx/security/advisories), troque a tag e o digest juntos
# (docker buildx imagetools inspect <imagem>:<tag>) e rode paperless/scripts/conferir.sh depois.

name: ${COMPOSE_PROJECT_NAME:-paperless}

services:
  db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?defina PAPERLESS_DBPASS no .env}
      TZ: America/Sao_Paulo
    volumes:
      - ${PAPERLESS_HOME:?defina PAPERLESS_HOME no .env}/data/postgres:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 30

  broker:
    image: valkey/valkey:9.0.1-alpine@sha256:c106a0c03bcb23cbdf9febe693114cb7800646b11ca8b303aee7409de005faa8
    restart: unless-stopped
    volumes:
      - ${PAPERLESS_HOME}/data/redis:/data
    networks: [interna]

  # Word, Excel, PowerPoint, OpenDocument e e-mail (.eml): o Tika extrai o texto (busca) e o Gotenberg gera o PDF de
  # visualização com o LibreOffice. O original fica guardado. Só na rede interna: sem porta, fora do alcance do assistente.
  tika:
    image: apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    restart: unless-stopped
    networks: [interna]

  gotenberg:
    image: gotenberg/gotenberg:8.37@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    restart: unless-stopped
    # O Chromium converte .eml: sem JavaScript e sem buscar nada de fora (pixel de rastreio, por exemplo).
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^file:///tmp/.*"
    networks: [interna]

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      broker: { condition: service_started }
      tika: { condition: service_started }
      gotenberg: { condition: service_started }
    # Só o loopback do host: a interface web abre por túnel SSH (docs/IMPLANTACAO.md). Sem Funnel.
    ports:
      - "127.0.0.1:${PORTA_HOST:-8010}:8000"
    volumes:
      - ${PAPERLESS_HOME}/data/paperless:/usr/src/paperless/data
      - ${PAPERLESS_HOME}/data/media:/usr/src/paperless/media
      - ${PAPERLESS_HOME}/export:/usr/src/paperless/export
      - ${PAPERLESS_HOME}/consumir:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?defina PAPERLESS_SECRET_KEY no .env}
      # Só na primeira subida: cria o superusuário. O token dele nunca vai para assistente nenhum.
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-}
      # Nomes aceitos no cabeçalho Host: "paperless" (assistentes, pela rede da ponte) e o loopback.
      PAPERLESS_URL: http://127.0.0.1:${PORTA_HOST:-8010}
      PAPERLESS_ALLOWED_HOSTS: paperless,127.0.0.1,localhost
      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIME_ZONE: America/Sao_Paulo
      PAPERLESS_OCR_LANGUAGE: por+eng
      PAPERLESS_OCR_LANGUAGES: por
      # Subpastas da pasta de consumo (consumir/leonardo, consumir/esposa); o dono vem do workflow.
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "false"
      # 0 = inotify (Linux). No Mac, o bind mount não avisa: use 10 (segundos).
      PAPERLESS_CONSUMER_POLLING: ${PAPERLESS_CONSUMER_POLLING:-0}
      # Pouca RAM: uma tarefa por vez.
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 1
      PAPERLESS_WEBSERVER_WORKERS: 1
      USERMAP_UID: ${USERMAP_UID:-1000}
      USERMAP_GID: ${USERMAP_GID:-1000}
      TZ: America/Sao_Paulo
    networks:
      interna: {}
      ponte_principal: { aliases: [paperless] }
      ponte_esposa: { aliases: [paperless] }
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8000/accounts/login/"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

networks:
  interna: {}
  # Uma rede por instância do assistente; o compose do assistente entra nela como "external"
  # (deploy/paperless/rede.yml). A da esposa existe mesmo sem a instância dela: custa nada.
  ponte_principal:
    name: ${REDE_PRINCIPAL:-assistente-paperless}
  ponte_esposa:
    name: ${REDE_ESPOSA:-assistente-esposa-paperless}
