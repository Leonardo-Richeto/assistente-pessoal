[project]
name = "assistente"
version = "0.1.0"
description = "Servidor MCP do assistente pessoal: ferramentas de domínio sobre o Postgres, com proxies para Paperless e vault."
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    # Cliente HTTP do worker do Pluggy; já vinha com o FastMCP 4.1.0, aqui fica explícito.
    "httpx2>=2.13",
]

[project.scripts]
assistente = "assistente.servidor:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistente"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
