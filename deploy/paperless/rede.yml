# Liga o servidor do assistente ao Paperless único (Ficha 6), pela rede que o projeto paperless/ cria
# (uma por instância: <COMPOSE_PROJECT_NAME>-paperless). O servidor vê o Paperless em http://paperless:8000;
# o banco e o broker do Paperless ficam numa rede que ele não vê.
#
# Ligar: no .env da instância, COMPOSE_FILE=docker-compose.yml:deploy/paperless/rede.yml e
# PAPERLESS_URL=http://paperless:8000. O Paperless precisa estar de pé antes (a rede é dele).
#
# gw_priority (Docker 28+): a rota padrão fica na rede do assistente, como antes do Paperless. Sem ele, o
# Docker escolhe a rede do Paperless ("assistente-paperless" vem antes de "assistente_default"), e o
# Tailscale, que divide a rede com o servidor, sai por ela. A queda do Funnel em 2026-10-24 não era isso:
# era a demora de até ~20 min para o Funnel voltar depois de recriar o tailscale (docs/IMPLANTACAO.md, P3 da Fase 2.1).
services:
  servidor:
    networks:
      default:
        gw_priority: 1
      paperless: {}

networks:
  paperless:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-assistente}-paperless
